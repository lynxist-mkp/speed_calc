[package]
name = "speed-calc"
version = "0.1.0"
description = "行测小助手本地版 - 资料分析速算训练"
authors = ["dev"]
edition = "2021"

[lib]
name = "speed_calc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
