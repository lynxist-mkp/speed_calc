version: 2

updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: daily
      time: '08:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      eslint:
        patterns:
          - 'eslint*'
          - '@eslint/*'
          - 'typescript-eslint'
      vue:
        patterns:
          - 'vue'
          - '@vue/*'
          - 'vue-*'
          - 'eslint-plugin-vue'
      test:
        patterns:
          - 'vitest'
          - '@vue/test-utils'
          - 'jsdom'
          - '@pinia/testing'
      tauri:
        patterns:
          - '@tauri-apps/*'
      commitlint:
        patterns:
          - '@commitlint/*'
    commit-message:
      prefix: 'chore(deps)'
      include: scope

  - package-ecosystem: cargo
    directory: '/src-tauri'
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(cargo)'
      include: scope

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(ci)'
      include: scope
