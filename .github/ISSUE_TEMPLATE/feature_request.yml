name: 功能请求
description: 提议一个新功能或改进
title: '[feat]: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        感谢提出功能建议！
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 这个功能要解决什么痛点
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望怎么实现
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你考虑过的其他方案
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: 补充说明
      description: 其他想说的
    validations:
      required: false
