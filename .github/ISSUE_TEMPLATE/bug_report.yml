name: Bug 报告
description: 报告一个 Bug 帮助我们改进
title: '[bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        感谢报告 Bug！请先搜索是否已有相同 issue。
  - type: textarea
    id: description
    attributes:
      label: Bug 描述
      description: 简要描述遇到了什么问题
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 详细描述如何复现
      placeholder: |
        1. 打开应用
        2. 点击「...」
        3. 输入「...」
        4. 看到错误
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你期望发生什么
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: 截图
      description: 如有截图请粘贴
    validations:
      required: false
  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 应用版本
      placeholder: '0.1.0'
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: 如有终端日志请粘贴（可选）
      render: shell
    validations:
      required: false
